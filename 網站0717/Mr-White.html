<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懷特 WHITE · 商務娛樂顧問</title>
<meta name="description" content="台北商務招待安排。進場前價格算清楚，離場前帳單逐項核對。Taipei business hospitality arrangements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   懷特 WHITE — 打字機 / 複寫紙
   牛皮紙 #E9E2D2 ・ 色帶黑 #2B2823 ・ 色帶紅 #B23A2E
   拉丁字用 Courier Prime，中文自動落到 Noto Sans TC
   （中文本身即等寬全形，兩者並置剛好對齊）
   ═══════════════════════════════════════════════════ */
:root{
  --paper:#E9E2D2;
  --form:#F6F1E4;
  --ink:#2B2823;
  --ink2:#6D6759;
  --rule:#C6BDA8;
  --red:#B23A2E;
  --carbon:#232019;
  --lit:#F1E6D1;                        /* 暗場中的暖奶油高光 */
  --gold-lit:#D9A05B;                   /* 暗場中的威士忌琥珀 */
  --mono:"Courier Prime","Noto Sans TC",ui-monospace,monospace;
  --slab:"Special Elite","Noto Sans TC",serif;
  --pad:clamp(20px,5vw,60px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:var(--mono);font-size:15px;line-height:1.85;
  color:var(--ink);background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 55%);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1000px;margin:0 auto;padding:0 var(--pad)}
.band{padding-top:clamp(50px,8vw,92px);padding-bottom:clamp(50px,8vw,92px);border-top:1px solid var(--rule)}

.eyebrow{
  font-family:var(--slab);font-size:11px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--red);margin-bottom:16px;
  text-align:center;text-indent:.34em;   /* 補償字距造成的視覺偏左 */
}
.sec-title{
  font-family:var(--slab);font-size:clamp(25px,4.4vw,40px);
  line-height:1.32;letter-spacing:.05em;
  text-align:center;text-indent:.05em;
}
.sec-title::after{
  content:"";display:block;width:70px;height:0;
  border-top:3px double var(--ink);margin:14px auto 0;
}
.sec-note{color:var(--ink2);font-size:14px;margin-top:16px;max-width:44em}

/* ── 信頭（固定於頁面上方） ── */
.mast{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:20px;
  background:var(--paper);
  /* 沿用 body 的複寫紙橫紋，固定後底下的紙感不會斷開 */
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px);
  transition:background-color .45s ease, box-shadow .22s ease;
}
.mast.is-stuck{box-shadow:0 2px 14px rgba(43,40,35,.14)}

/* 還壓在首屏暗場上時，信頭跟著轉暗；捲過首屏才換回紙白 */
.mast-name,.mast-name small,.lang button,.docmeta{transition:color .45s ease}
.mast-in,.docmeta{transition:border-color .45s ease}
/* 壓在暗場上時信頭透明，直接透出首屏自己的漸層，
   否則純色信頭與底下的光暈之間會出現一道色階 */
html.at-hero .mast{
  background-color:rgba(14,11,8,0);background-image:none;box-shadow:none;
}
html.at-hero .mast-in{border-bottom-color:rgba(217,160,91,.55)}
html.at-hero .mast-name{color:var(--lit)}
html.at-hero .mast-name small{color:rgba(237,226,205,.52)}
html.at-hero .lang button{color:rgba(237,226,205,.52)}
html.at-hero .lang button[aria-pressed="true"]{color:var(--gold-lit)}
html.at-hero .docmeta{
  color:rgba(237,226,205,.48);
  border-bottom-color:rgba(237,226,205,.16);
}
/* 錨點捲動時避開固定信頭 */
[id]{scroll-margin-top:calc(var(--mast-h,96px) + 14px)}
.mast-in{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;padding-bottom:12px;border-bottom:3px double var(--ink);
}
.mast-name{font-family:var(--slab);font-size:17px;letter-spacing:.3em}
.mast-name small{font-size:11px;letter-spacing:.24em;color:var(--ink2);margin-left:10px}
.lang{display:flex;gap:14px;font-size:12.5px;letter-spacing:.1em}
.lang button{color:var(--ink2);transition:color .2s}
.lang button::before{content:"[ ] ";font-family:var(--mono)}
.lang button[aria-pressed="true"]{color:var(--red);font-weight:700}
.lang button[aria-pressed="true"]::before{content:"[×] "}
.docmeta{
  display:flex;gap:22px;flex-wrap:wrap;padding:9px 0;
  font-size:10.5px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;
  border-bottom:1px solid var(--rule);
}
.blink{color:var(--red);animation:bk 1.15s steps(1) infinite}
@keyframes bk{50%{opacity:0}}

/* ── 首屏：讓 hero 下方那條分隔線貼齊畫面底部 ──
   信頭改為 fixed 後脫離文件流，用 --mast-h 補回它佔的高度（由 JS 實測） */
.screen{
  --hero-fade:clamp(180px,30vh,380px);  /* 底部溶入紙面的漸層帶高度 */
  --fade-top:calc(100% - var(--hero-fade));
  position:relative;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-top:var(--mast-h,96px);
  color:var(--lit);
}
/* 暗場整層做在 ::before，而不是 .screen 自己的背景。
   這樣可以用遮罩讓「整層」在底部淡出到全透明，露出頁面原本的紙面
   （含紙紋與左上的白色光暈）。先前是疊一層不透明紙色去蓋，
   終點寫死 --paper，與 body 實際算出來的顏色只要有一點差，
   交界就會出現一道階梯——改成淡出到透明後，這種落差結構上不可能發生。
   遮罩只作用在這層裝飾，內容在 .hero（z-index:1）不受影響。 */
.screen::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    /* 失焦的暖色高光，模擬吧檯上的散景 */
    radial-gradient(circle 92px at 11% 73%, rgba(217,160,91,.16), transparent 70%),
    radial-gradient(circle 62px at 89% 61%, rgba(217,160,91,.13), transparent 70%),
    radial-gradient(circle 42px at 73% 88%, rgba(232,184,113,.10), transparent 70%),
    /* 威士忌琥珀與一抹朱紅的大面積光暈 */
    radial-gradient(120% 74% at 50% 82%, rgba(201,138,60,.30) 0%, rgba(201,138,60,0) 62%),
    radial-gradient(72% 48% at 84% 20%, rgba(178,58,46,.15) 0%, rgba(178,58,46,0) 66%),
    /* 底層近黑 */
    linear-gradient(180deg, #0E0B08 0%, #16110C 56%, #1E170F 100%);
  /* 透明度走 S 形曲線（smoothstep），兩端的變化率都趨近 0，
     看不出漸層從哪裡開始、又在哪裡結束 */
  -webkit-mask-image:linear-gradient(180deg,
    #000                var(--fade-top),
    rgba(0,0,0,.97) calc(var(--fade-top) + var(--hero-fade) * .10),
    rgba(0,0,0,.90) calc(var(--fade-top) + var(--hero-fade) * .20),
    rgba(0,0,0,.78) calc(var(--fade-top) + var(--hero-fade) * .30),
    rgba(0,0,0,.65) calc(var(--fade-top) + var(--hero-fade) * .40),
    rgba(0,0,0,.50) calc(var(--fade-top) + var(--hero-fade) * .50),
    rgba(0,0,0,.35) calc(var(--fade-top) + var(--hero-fade) * .60),
    rgba(0,0,0,.22) calc(var(--fade-top) + var(--hero-fade) * .70),
    rgba(0,0,0,.10) calc(var(--fade-top) + var(--hero-fade) * .80),
    rgba(0,0,0,.03) calc(var(--fade-top) + var(--hero-fade) * .90),
    rgba(0,0,0,0)       100%);
  mask-image:linear-gradient(180deg,
    #000                var(--fade-top),
    rgba(0,0,0,.97) calc(var(--fade-top) + var(--hero-fade) * .10),
    rgba(0,0,0,.90) calc(var(--fade-top) + var(--hero-fade) * .20),
    rgba(0,0,0,.78) calc(var(--fade-top) + var(--hero-fade) * .30),
    rgba(0,0,0,.65) calc(var(--fade-top) + var(--hero-fade) * .40),
    rgba(0,0,0,.50) calc(var(--fade-top) + var(--hero-fade) * .50),
    rgba(0,0,0,.35) calc(var(--fade-top) + var(--hero-fade) * .60),
    rgba(0,0,0,.22) calc(var(--fade-top) + var(--hero-fade) * .70),
    rgba(0,0,0,.10) calc(var(--fade-top) + var(--hero-fade) * .80),
    rgba(0,0,0,.03) calc(var(--fade-top) + var(--hero-fade) * .90),
    rgba(0,0,0,0)       100%);
}
/* 內容讓開漸層帶的後 2/3。前段透明度還不到三成，淺色字在那裡仍然清楚，
   全部讓開反而會把版面擠得太上面 */
.screen .hero{padding-bottom:calc(clamp(40px,6vw,72px) + var(--hero-fade) * .66)}
/* 交界要柔和，就不能再有那條硬線 */
.screen + .band{border-top:none}

/* 首屏內的字色全面翻轉為暖色 */
.screen .hero{position:relative;z-index:1}
.screen .eyebrow{color:var(--gold-lit)}
.screen .hero-mark{color:var(--lit)}
.screen .hero-mark span{color:#C9573F}
.screen .hero-role{color:rgba(237,226,205,.60)}
.screen .typed{color:var(--lit)}
.screen .cur{color:var(--gold-lit)}
.screen .hero-sub{color:rgba(237,226,205,.66)}
/* 需壓過後面 .hero .cta .btn 的同權重規則，故多帶一層 .hero */
.screen .hero .cta .btn{color:rgba(237,226,205,.72)}
.screen .hero .cta .btn-k{color:var(--gold-lit)}
.screen .hero .cta .btn:hover{color:var(--lit)}
.screen .hero .cta .btn-k:hover{color:#EFC98B}

/* ── HERO ── */
.hero{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding-top:clamp(11px,2vw,22px);padding-bottom:clamp(40px,6vw,72px);
}
.hero-mark{
  font-family:var(--slab);font-size:clamp(46px,12.5vw,116px);
  line-height:1;letter-spacing:.06em;
  text-align:center;text-indent:.06em;
}
.hero-mark span{color:var(--red)}
.hero-role{
  font-size:clamp(12px,2.4vw,15px);letter-spacing:.44em;
  color:var(--ink2);margin-top:18px;text-transform:uppercase;
  text-align:center;text-indent:.44em;   /* 補償字距造成的視覺偏左 */
}
.typed{
  font-family:var(--slab);font-size:clamp(20px,4vw,32px);
  line-height:1.62;margin-top:34px;min-height:3.4em;letter-spacing:.02em;
  text-align:center;text-indent:.02em;   /* 補償字距造成的視覺偏左 */
}
.cur{color:var(--red);animation:bk 1.05s steps(1) infinite}
.hero-sub{margin-top:clamp(63px,11vw,112px);color:var(--ink2);font-size:14px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:34px}
.btn{
  display:inline-block;padding:12px 18px;font-size:13.5px;letter-spacing:.14em;
  border:1px solid var(--ink);text-decoration:none;transition:.2s;
}
.btn-k{background:var(--ink);color:var(--form)}
.btn-k:hover{background:var(--red);border-color:var(--red)}
.btn-o:hover{background:var(--ink);color:var(--form)}

/* Hero 行動呼籲：置中直排、去外框，以文字為主 */
.hero .cta{
  flex-direction:column;align-items:center;
  gap:0;margin-top:clamp(30px,5vw,44px);
}
.hero .cta .btn{
  position:relative;padding:12px 6px;
  border:none;background:none;
  font-size:14.5px;letter-spacing:.22em;
  text-indent:.22em;                 /* 補償字距造成的視覺偏左 */
  color:var(--ink2);transition:color .2s;
}
.hero .cta .btn-k{color:var(--red);font-weight:700}   /* 主要動作用色帶紅帶頭 */
.hero .cta .btn:hover{background:none;border-color:transparent;color:var(--ink)}
.hero .cta .btn-k:hover{color:var(--red)}
/* 滑過時由中間往外展開的虛線，沿用估價單的引導線語彙 */
.hero .cta .btn::after{
  content:"";position:absolute;left:50%;right:50%;bottom:5px;
  border-bottom:1px dotted currentColor;opacity:.5;
  transition:left .26s ease,right .26s ease;
}
.hero .cta .btn:hover::after{left:12%;right:12%}

/* ── 服務 ── */
/* 無邊框：拿掉格線與底色，改用編號與留白分欄 */
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));
  gap:clamp(30px,4.6vw,46px) clamp(26px,4vw,54px);
  margin-top:clamp(34px,5vw,50px);
}
.grid > div{padding-top:2px}
.grid i{
  display:block;font-style:normal;font-family:var(--slab);
  font-size:11.5px;letter-spacing:.22em;color:var(--red);
}
/* 方括號沿用頁面既有的語彙（語言鍵、折疊鍵），比外框更輕 */
.grid i::before{content:"[";color:var(--rule)}
.grid i::after{content:"]";color:var(--rule);margin-left:-.22em}
.grid b{display:block;font-family:var(--slab);font-size:16.5px;letter-spacing:.09em;line-height:1.35;margin-top:12px}
.grid span{display:block;font-size:12.8px;color:var(--ink2);margin-top:9px;line-height:1.9;max-width:24em}

/* ── 場合對照 ── */
.occ{width:100%;border-collapse:collapse;margin-top:34px;font-size:14px}
.occ th{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);
  text-align:left;font-weight:400;padding:0 12px 10px 0;border-bottom:2px solid var(--ink);
}
.occ td{padding:17px 12px 17px 0;border-bottom:1px dotted var(--rule);vertical-align:top}
.occ tr:hover td{background:rgba(178,58,46,.045)}
.occ .c1{font-family:var(--slab);font-size:15.5px;letter-spacing:.05em;width:28%}
.occ .c2{color:var(--red);white-space:nowrap}
.occ .c3{white-space:nowrap;font-size:13px}
.occ .c4{color:var(--ink2);font-size:12.8px;line-height:1.75}

/* ── 估價單（招牌） ── */
.desk{background:var(--carbon);border-top:none}
.desk .eyebrow{color:#D9705F}
.desk .sec-title{color:var(--form)}
.desk .sec-title::after{border-color:rgba(246,241,228,.5)}
.desk .sec-note{color:rgba(246,241,228,.55)}
.slip{
  position:relative;margin-top:38px;background:var(--form);
  padding:clamp(22px,4vw,40px) clamp(30px,5vw,58px);
  box-shadow:0 24px 54px rgba(0,0,0,.45);
}
/* 連續報表紙送紙孔 */
.slip::before,.slip::after{
  content:"";position:absolute;top:0;bottom:0;width:20px;
  background-image:radial-gradient(circle,var(--carbon) 3.2px,transparent 3.4px);
  background-size:20px 26px;background-position:center 13px;
  border-right:1px dashed var(--rule);
}
.slip::before{left:0}
.slip::after{right:0;border-right:none;border-left:1px dashed var(--rule)}

.slip-hd{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  flex-wrap:wrap;padding-bottom:13px;border-bottom:3px double var(--ink);
}
.slip-hd b{font-family:var(--slab);font-size:18px;letter-spacing:.16em}
.slip-hd em{font-style:normal;font-size:10.5px;letter-spacing:.16em;color:var(--ink2)}

.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--rule);margin:22px 0 0}
.tabs button{
  flex:1 1 auto;padding:11px 14px;font-size:13px;letter-spacing:.08em;
  color:var(--ink2);border-right:1px solid var(--rule);white-space:nowrap;transition:.18s;
}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--form)}

/* 試算機店家選擇：固定同一列三等分（#vTabs 仍用彈性排列） */
#tabs{display:grid;grid-template-columns:repeat(3,1fr)}
#tabs button{white-space:normal;text-align:center}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px 26px;margin-top:26px}
/* 標籤與加減鍵並排 */
.fld{display:flex;align-items:center;gap:14px}
.fld label{
  flex:1 1 0;min-width:0;font-size:10px;letter-spacing:.2em;
  color:var(--ink2);text-transform:uppercase;
}
.fld .step,.fld .pay{flex:2 1 0;min-width:0}   /* 佔一列的 2/3 */
.step,.pay{display:flex;border:1px solid var(--rule);background:#fff}
.step button{width:42px;height:44px;color:var(--ink2);font-size:17px;transition:.15s}
.step button:hover{background:var(--ink);color:var(--form)}
.step output{flex:1;text-align:center;line-height:44px;font-size:16px;font-weight:700}
.pay button{flex:1;height:44px;font-size:13px;color:var(--ink2);transition:.18s}
.pay button[aria-pressed="true"]{background:var(--red);color:#fff}

/* 總計移到細項上方，細項預設收合 */
.lines-toggle{
  display:inline-flex;align-items:center;gap:9px;
  margin-top:18px;padding:0;
  font-size:12.5px;letter-spacing:.16em;color:var(--ink2);
  transition:color .2s;
}
/* 沿用折疊區塊的 [+] / [−] 語彙 */
.lines-toggle::before{content:"[+]";font-family:var(--mono);color:var(--red)}
.lines-toggle[aria-expanded="true"]::before{content:"[−]"}
.lines-toggle:hover{color:var(--ink)}
/* 不加展開動畫：與頁面既有的 <details> 折疊一致，
   也避免 fill-mode 讓內容在動畫沒跑起來時卡在透明狀態 */
.lines[hidden]{display:none}
.lines{margin-top:14px;border-top:1px dashed var(--rule);padding-top:6px}
.ln{display:flex;align-items:baseline;gap:7px;padding:8px 0;font-size:13.5px}
.ln .n{white-space:nowrap}
.ln .n em{font-style:normal;font-size:11.5px;color:var(--ink2);margin-left:7px}
.ln .d{flex:1;border-bottom:1px dotted #B6AC94;transform:translateY(-4px)}
.ln .v{white-space:nowrap}
.tot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-top:26px;padding:17px 20px;
  border:3px double var(--red);color:var(--red);
}
.tot span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.tot strong{font-family:var(--slab);font-size:clamp(27px,6.4vw,42px);letter-spacing:.02em}
.slip-ft{margin-top:16px;font-size:12px;color:var(--ink2);line-height:1.85}
.stamp{
  position:absolute;right:clamp(24px,6vw,66px);bottom:clamp(18px,4vw,34px);
  transform:rotate(-9deg);border:2px solid var(--red);
  padding:7px 13px;color:var(--red);opacity:.62;
  font-family:var(--slab);font-size:11px;letter-spacing:.2em;text-align:center;
  box-shadow:inset 0 0 0 1px var(--red);pointer-events:none;line-height:1.4;
}
.desk-note{margin-top:32px;font-size:12.5px;color:rgba(246,241,228,.52);line-height:1.9}

/* ── 流程 ── */
.flow{margin-top:38px;border-top:2px solid var(--ink)}
.flow > div{display:grid;grid-template-columns:60px 1fr;gap:18px;padding:22px 0;border-bottom:1px dotted var(--rule)}
.flow i{font-style:normal;font-family:var(--slab);font-size:13px;color:var(--red);padding-top:4px}
.flow b{display:block;font-family:var(--slab);font-size:17px;letter-spacing:.09em}
.flow p{color:var(--ink2);font-size:13.5px;margin-top:6px;max-width:42em}

/* ── 店家 ── */
.ven{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;list-style:none}
.ven li{font-size:14px;letter-spacing:.07em;padding:8px 16px;border:1px solid var(--rule);background:var(--form)}
.ven li:hover{border-color:var(--red);color:var(--red)}
/* 白底方框，左右兩側漸層淡出融入紙面。
   漸層一律用「同色 0 透明度」而非 transparent 關鍵字，
   否則部分瀏覽器會經過透明黑內插，邊緣泛灰。 */
.warn{
  --fade:clamp(18px,6vw,76px);
  margin-top:30px;
  padding:22px calc(var(--fade) + 14px);
  font-size:13px;line-height:1.9;
  background:linear-gradient(90deg,
    rgba(246,241,228,0) 0,
    var(--form) var(--fade),
    var(--form) calc(100% - var(--fade)),
    rgba(246,241,228,0) 100%);
  border:1px solid transparent;
  border-image:linear-gradient(90deg,
    rgba(178,58,46,0) 0,
    rgba(178,58,46,.32) var(--fade),
    rgba(178,58,46,.32) calc(100% - var(--fade)),
    rgba(178,58,46,0) 100%) 1;
}

/* ── 折疊 ── */
.acc{border-top:2px solid var(--ink);margin-top:34px}
.acc details{border-bottom:1px dotted var(--rule)}
.acc summary{
  list-style:none;cursor:pointer;position:relative;padding:18px 38px 18px 0;
  font-family:var(--slab);font-size:15.5px;letter-spacing:.05em;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"[+]";position:absolute;right:0;top:18px;font-family:var(--mono);font-size:13px;color:var(--red)}
.acc details[open] summary::after{content:"[−]"}
.acc .bd{padding:0 0 22px;font-size:13.5px;color:#443F36;line-height:1.95;max-width:50em}
.acc .bd b{color:var(--red);font-weight:700}
.acc .bd ul{margin:9px 0 0 17px;color:var(--ink2);font-size:12.5px}

/* ── 郵件預約單 ── */
.book-form{
  margin-top:36px;background:var(--form);border:1px solid var(--rule);
  padding:clamp(24px,4vw,42px) clamp(22px,4.5vw,50px);
  box-shadow:0 18px 42px rgba(43,40,35,.10);
}
.bk-hd{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  flex-wrap:wrap;padding-bottom:13px;border-bottom:3px double var(--ink);
}
.bk-hd b{font-family:var(--slab);font-size:18px;letter-spacing:.16em}
.bk-hd em{font-style:normal;font-size:10.5px;letter-spacing:.16em;color:var(--ink2)}

.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:18px 26px;margin-top:26px}
.bk-f{display:flex;flex-direction:column;gap:7px;min-width:0}
.bk-f.wide{grid-column:1 / -1}
.bk-f label{font-size:10px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase}
.bk-f label i{font-style:normal;color:var(--red);margin-left:5px}
.bk-f input,.bk-f select,.bk-f textarea{
  width:100%;font:inherit;font-size:14.5px;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:0;
  padding:11px 13px;transition:border-color .18s;
}
.bk-f textarea{min-height:96px;resize:vertical;line-height:1.75}
.bk-f input:focus,.bk-f select:focus,.bk-f textarea:focus{outline:none;border-color:var(--red)}
.bk-f input::placeholder,.bk-f textarea::placeholder{color:#A79E8A}

.bk-chk{
  display:flex;align-items:flex-start;gap:11px;cursor:pointer;
  margin-top:24px;padding:14px 16px;border:1px dashed var(--rule);
  font-size:13px;color:var(--ink2);line-height:1.7;
}
.bk-chk input{width:16px;height:16px;margin-top:3px;flex:none;accent-color:var(--red);cursor:pointer}
.bk-est{display:block;margin-top:5px;font-size:12px;color:var(--red);letter-spacing:.02em}

.bk-act{
  display:flex;flex-wrap:wrap;gap:11px;align-items:center;
  margin-top:26px;padding-top:22px;border-top:1px dashed var(--rule);
}
.bk-act .btn{cursor:pointer}
.bk-msg{margin-top:14px;font-size:12.5px;line-height:1.85;color:var(--ink2);min-height:1.85em}
.bk-msg.is-ok{color:var(--red)}
.bk-mail{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.bk-mail b{color:var(--ink);font-weight:400;border-bottom:1px dotted #B6AC94}

/* ── 頁尾 ── */
.foot{background:var(--carbon);color:#CBC4B2;padding:clamp(46px,7vw,84px) 0 30px;border:none}
.foot .cta{margin-top:28px}
.foot .cta .btn{margin-top:0}
.foot h2{font-family:var(--slab);font-size:clamp(22px,4.2vw,34px);color:var(--form);line-height:1.5;letter-spacing:.05em}
.foot p{margin-top:15px;font-size:13.5px;color:rgba(203,196,178,.7);max-width:34em}
.foot .btn{border-color:var(--form);color:var(--form);margin-top:28px}
.foot .btn:hover{background:var(--red);border-color:var(--red)}
.foot-meta{
  margin-top:40px;padding-top:20px;border-top:1px dashed rgba(255,255,255,.2);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:10.5px;letter-spacing:.14em;color:rgba(203,196,178,.42);text-transform:uppercase;
}
.dis{margin-top:12px;font-size:11px;color:rgba(203,196,178,.36);line-height:1.9;max-width:46em}

/* ═══════════════════════════════════════════════════
   響應式 — 斷點一律由大到小覆寫
   ≤900px  平板／手機：表格改卡片式
   ≤560px  手機直式：估價單改雙欄堆疊、按鈕滿版
   ≤380px  小尺寸手機：再收一次字級與內距
   ═══════════════════════════════════════════════════ */

/* ── ≤900px：表格改卡片式 ── */
@media(max-width:900px){
  /* 場合對照：表格轉為卡片，避免四欄擠壓 */
  .occ,.occ tbody,.occ tr,.occ td{display:block;width:100%}
  .occ thead{display:none}
  .occ tr{padding:18px 0;border-bottom:1px dotted var(--rule)}
  .occ tr:hover td{background:none}
  .occ td{border:none;padding:0}
  .occ .c1{width:auto;font-size:17px;margin-bottom:6px}
  .occ .c2,.occ .c3{display:inline;white-space:normal}
  .occ .c3::before{content:" · ";color:var(--rule)}
  .occ .c4{margin-top:8px}

  /* 估價單：關掉報表紙送紙孔與絕對定位印章 */
  .slip::before,.slip::after{display:none}
  .slip{padding:clamp(24px,4vw,40px) clamp(22px,4vw,40px)}
  .stamp{position:static;display:inline-block;margin-top:22px;transform:rotate(-3deg)}
}

/* ── ≤560px：手機直式 ── */
@media(max-width:560px){
  .mast{padding-top:16px}
  .docmeta{gap:6px 16px;font-size:10px}

  .hero{padding-top:10px;padding-bottom:34px}
  .hero-role{letter-spacing:.26em;text-indent:.26em}
  .typed{margin-top:26px;min-height:3.6em}
  /* 按鈕不再滿版，依文字寬度並排，放不下才換行 */
  .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .btn{text-align:center;padding:13px 16px}

  /* 服務卡固定單欄，避免 minmax 撐出容器 */
  /* 服務範圍：手機維持兩欄，六項排成 2×3 */
  .grid{grid-template-columns:1fr 1fr;gap:26px 18px}
  .grid b{font-size:15.5px;margin-top:10px}
  .grid span{font-size:12px;line-height:1.85;margin-top:7px}
  /* 中文標題一律四字剛好一行，英文長短不一；只在英文版鎖成兩行高，
     同一列的說明文字才會從相同位置開始 */
  html[lang="en"] .grid b{min-height:2.7em}

  /* 分頁：改二欄格線，取代會斷邊框的 flex 換行 */
  .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
  .tabs button{
    border:none;border-top:1px solid var(--rule);border-right:1px solid var(--rule);
    padding:13px 8px;font-size:12.5px;white-space:normal;
  }
  .tabs button:nth-child(-n+2){border-top:none}
  .tabs button:nth-child(2n){border-right:none}
  .tabs button:nth-child(3):last-child{grid-column:1 / -1;border-right:none}

  /* 店家選擇：手機也維持同列三等分 */
  #tabs{grid-template-columns:repeat(3,1fr)}
  #tabs button{border-top:none;border-right:1px solid var(--rule)}
  #tabs button:last-child{grid-column:auto;border-right:none}

  .slip{padding:22px 18px}
  .slip-hd b{font-size:16px}
  .fields{gap:14px;margin-top:22px}
  .fld{gap:10px}

  /* 預約單：預設單欄，日期／時間、賓客／小姐兩兩並排 */
  .book-form{padding:22px 18px}
  .bk-hd b{font-size:16px}
  .bk-grid{grid-template-columns:1fr 1fr;gap:15px 10px;margin-top:22px}
  .bk-f{grid-column:1 / -1}
  .bk-f.half{grid-column:span 1}
  /* 並排欄位較窄，收一點內距與字級，避免日期／時間的原生圖示被擠掉 */
  .bk-f.half label{letter-spacing:.14em}
  .bk-f.half input,.bk-f.half select{padding:10px 9px;font-size:13.5px}
  /* 標籤長短不一時（英文版尤其明顯）把輸入框推到底部對齊，同列不會參差 */
  .bk-f.half input,.bk-f.half select{margin-top:auto}
  .bk-act{gap:9px}

  /* 明細行：標題與說明堆疊、金額靠右，取消點線引導 */
  .lines{margin-top:12px}
  .ln{flex-wrap:wrap;align-items:flex-start;gap:0 10px;padding:10px 0}
  .ln .n{flex:1 1 0;min-width:0;white-space:normal}
  .ln .n em{display:block;margin-left:0;margin-top:3px}
  .ln .d{display:none}
  .ln .v{flex:0 0 auto;margin-left:auto;font-weight:700}

  .tot{padding:15px 16px;gap:4px 12px}

  .flow > div{grid-template-columns:34px 1fr;gap:12px;padding:20px 0}
  .flow b{font-size:16px}

  .ven li{font-size:13.5px;padding:7px 13px}
  .warn{--fade:14px;padding:18px 24px;margin-top:24px}

  .acc summary{padding:16px 34px 16px 0;font-size:15px}
  .acc summary::after{top:16px}

  .foot-meta{gap:8px}
}

/* ── ≤380px：小尺寸手機 ── */
@media(max-width:380px){
  :root{--pad:18px}
  .mast-name{font-size:15px;letter-spacing:.22em}
  .lang{gap:10px;font-size:11.5px}
  .slip{padding:20px 15px}
  .step button{width:38px}
  .ln{font-size:13px}
  .tabs button{font-size:11.5px;letter-spacing:.04em;padding:12px 6px}

  /* 服務範圍：小尺寸手機兩欄更窄，再收一次字級與欄距 */
  .grid{gap:22px 12px}
  .grid i{font-size:10.5px;letter-spacing:.18em}
  .grid b{font-size:14.5px;letter-spacing:.05em}
  .grid span{font-size:11.5px}

  /* 預約單：並排欄位在小尺寸手機再收一次，並讓出原生日曆／時鐘圖示的位置，
     否則「下午 08:00」會被圖示壓掉尾巴（欄寬只剩約 97px） */
  .book-form{padding:20px 15px}
  .bk-grid{gap:14px 8px}
  .bk-f.half input,.bk-f.half select{padding:9px 7px;font-size:12.5px}
  .bk-f.half input[type="date"]::-webkit-calendar-picker-indicator,
  .bk-f.half input[type="time"]::-webkit-calendar-picker-indicator{display:none}
}
</style>
</head>
<body>

<header class="mast" id="mast">
  <div class="wrap">

/* ══════════════════════════════════════════════════════════ */

let lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
const st = { type:"dress", hours:2, guests:2, girls:2, pay:"cash" };
const LIM = { hours:[1,10], guests:[1,20], girls:[1,20] };
const nt = n => "$" + n.toLocaleString("en-US");
const L = () => T[lang];

/* ── 估價單 ── */
let lastEst = null;                      /* 最近一次試算結果，供預約單附帶 */

/* 依店型與男性賓客人數取包廂費級距；超過最後一級就沿用最後一級 */
function roomTier(n, type){
  const fees = ROOM_FEES[type] || ROOM_FEES.default;
  for(let i = 0; i < ROOM_BRACKETS.length; i++){
    if(n <= ROOM_BRACKETS[i]){
      return {
        fee: fees[i],
        lo : i === 0 ? 1 : ROOM_BRACKETS[i-1] + 1,
        hi : ROOM_BRACKETS[i],
        over: false
      };
    }
  }
  const last = ROOM_BRACKETS.length - 1;
  return { fee:fees[last], lo:ROOM_BRACKETS[last], hi:null, over:true };
}

function calc(){
  const r = RATE[st.type], t = L();
  const rt = roomTier(st.guests, st.type);
  const roomNote = rt.over
    ? `${rt.lo}${t.unitP}${t.roomOver}`
    : `${rt.lo}–${rt.hi}${t.unitP}`;
  const items = [
    [t.liHour, `${nt(r.hour)} × ${st.girls} × ${st.hours}${t.unitH}`, r.hour*st.girls*st.hours],
    [t.liHead, `${nt(r.head)} × ${st.guests}`, r.head*st.guests],
    [t.liRoom, roomNote,  rt.fee],
    [t.liTip,  t.exTip,   r.tip],
    [t.liTable,t.exTable, r.table]
  ];
  let sum = items.reduce((a,b)=>a+b[2],0);
  let html = items.map(i=>`<div class="ln"><span class="n">${i[0]}<em>${i[1]}</em></span><span class="d"></span><span class="v">${nt(i[2])}</span></div>`).join("");
  if(st.pay==="card"){
    const fee = Math.round(sum*CARD_FEE);
    html += `<div class="ln"><span class="n">${t.liFee}<em>${t.exFee}</em></span><span class="d"></span><span class="v">${nt(fee)}</span></div>`;
    items.push([t.liFee, t.exFee, fee]);
    sum += fee;
  }
  document.getElementById("lines").innerHTML = html;
  document.getElementById("total").textContent = nt(sum);
  document.getElementById("oHours").textContent  = st.hours  + t.unitH;
  document.getElementById("oGuests").textContent = st.guests + t.unitP;
  document.getElementById("oGirls").textContent  = st.girls  + t.unitP;

  lastEst = { venue:r[lang], items, sum };
  syncBooking();
}

/* ── 細項收合：預設只露出總計，按「查看細項」才展開 ── */
let linesOpen = false;
const linesEl  = document.getElementById("lines");
const linesBtn = document.getElementById("linesToggle");
function renderLinesToggle(){
  if(!linesBtn) return;
  linesBtn.textContent = linesOpen ? L().linesHide : L().linesShow;
  linesBtn.setAttribute("aria-expanded", String(linesOpen));
  linesEl.hidden = !linesOpen;
}
if(linesBtn) linesBtn.addEventListener("click",()=>{
  linesOpen = !linesOpen;
  renderLinesToggle();
});

/* ── 打字動畫（三句輪播：打字 → 停頓 → 逐字刪除 → 下一句） ── */
const TYPE_IN = 62, TYPE_DEL = 26, TYPE_HOLD = 2400, TYPE_GAP = 420;
let typeTimer, typeIdx = 0;

/* 量出三句中最高的一句，把 .typed 高度鎖住，換句時不會推擠下方按鈕 */
function lockTypedHeight(){
  const el = document.getElementById("typed"), keep = el.innerHTML;
  el.style.minHeight = "0px";
  let max = 0;
  L().types.forEach(str=>{
    el.innerHTML = str.replace(/\n/g,"<br>") + '<span class="cur">▌</span>';
    max = Math.max(max, el.offsetHeight);
  });
  el.innerHTML = keep;
  el.style.minHeight = max + "px";
}
function typeHero(){
  const el = document.getElementById("typed"), lines = L().types;
  const draw = str => { el.innerHTML = str.replace(/\n/g,"<br>") + '<span class="cur">▌</span>'; };
  clearTimeout(typeTimer);
  typeIdx = 0;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ draw(lines[0]); return; }

  (function cycle(){
    const full = lines[typeIdx];
    let i = 0;
    (function typeIn(){
      draw(full.slice(0, i));
      if(i++ < full.length)     typeTimer = setTimeout(typeIn, TYPE_IN);
      else if(lines.length > 1) typeTimer = setTimeout(erase, TYPE_HOLD);
    })();
    function erase(){
      let j = full.length;
      (function step(){
        draw(full.slice(0, j));
        if(j-- > 0) typeTimer = setTimeout(step, TYPE_DEL);
        else { typeIdx = (typeIdx + 1) % lines.length; typeTimer = setTimeout(cycle, TYPE_GAP); }
      })();
    }
  })();
}

/* ── 固定信頭：實測高度寫回 --mast-h，供 .screen 與錨點預留空間 ── */
const mastEl = document.getElementById("mast");
function lockMastHeight(){
  if(mastEl) document.documentElement.style.setProperty("--mast-h", mastEl.offsetHeight + "px");
  syncHeroTheme();
}
/* 首屏是暗場，信頭壓在上面時要跟著轉暗；
   等首屏整個捲過信頭下緣，才切回紙白 */
const screenEl = document.querySelector(".screen");
function syncHeroTheme(){
  if(!screenEl) return;
  const edge = mastEl ? mastEl.offsetHeight : 0;
  const stillDark = screenEl.getBoundingClientRect().bottom > edge + 1;
  document.documentElement.classList.toggle("at-hero", stillDark);
}
addEventListener("scroll",()=>{
  if(mastEl) mastEl.classList.toggle("is-stuck", scrollY > 4);
  syncHeroTheme();
},{passive:true});

/* ══ 郵件預約單 ═══════════════════════════════════════════
   靜態站沒有後端，純 HTML 表單本身寄不了信。這裡改用 mailto：
   把內容組好交給使用者自己的郵件軟體寄出，零後端、零第三方。
   沒設定郵件軟體的人（常見於桌機）則用「複製內容」備援。
   ═══════════════════════════════════════════════════════ */
const bkEl  = id => document.getElementById(id);
const bkVal = id => (bkEl(id) ? bkEl(id).value.trim() : "");
/* 郵件內文不需要標籤後面的「（選填）」 */
const bkLabel = s => String(s).replace(/\s*[（(][^）)]*[)）]\s*$/, "");

/* 人數與店型雙向綁定 st：預約單改了，附帶的試算也跟著改，
   避免信裡出現「表單寫 4 位店家店、試算卻是 2 位禮服店」這種互相打架的內容 */
[["bkGuests","guests"],["bkGirls","girls"]].forEach(([id,key])=>{
  const el = bkEl(id);
  if(!el) return;
  el.addEventListener("change",()=>{
    const [lo,hi] = LIM[key];
    let v = parseInt(el.value,10);
    if(!isFinite(v)) v = st[key];
    v = Math.min(hi, Math.max(lo, v));
    el.value = v; st[key] = v; calc();
  });
});
if(bkEl("bkType")) bkEl("bkType").addEventListener("change",()=>{
  const v = bkEl("bkType").value;
  if(!RATE[v]) return;                       /* 「請你建議」不動試算 */
  st.type = v;
  document.querySelectorAll("#tabs button")
    .forEach(b=>b.setAttribute("aria-selected", String(b.dataset.k === v)));
  calc();
});

function syncBooking(){
  const t = L();
  if(!bkEl("bookForm") || !lastEst) return;

  /* 正在輸入的欄位不動，避免打字打到一半被覆寫 */
  const put = (el,v)=>{ if(el && el !== document.activeElement && el.value != v) el.value = v; };
  put(bkEl("bkGuests"), st.guests);
  put(bkEl("bkGirls"),  st.girls);
  const ty = bkEl("bkType");
  if(ty && ty.value !== st.type) ty.value = st.type;

  const note = bkEl("bkEstNote");
  if(note) note.textContent =
    `${lastEst.venue} · ${st.hours}${t.unitH} · ${t.fGuests} ${st.guests} · ` +
    `${t.fGirls} ${st.girls} · ${st.pay === "cash" ? t.payCash : t.payCard} · ${nt(lastEst.sum)}`;
}

function bookingSubject(){
  const t = L();
  const when = [bkVal("bkDate"), bkVal("bkTime")].filter(Boolean).join(" ");
  const pax  = bkVal("bkGuests") ? bkVal("bkGuests") + t.unitP : "";
  return [t.bkSubject, when, bkVal("bkName"), pax].filter(Boolean).join(" · ");
}

function bookingBody(){
  const t = L(), s = t.sep, ty = bkEl("bkType");
  const rows = [
    [t.bkName,    bkVal("bkName")],
    [t.bkEmail,   bkVal("bkEmail")],
    [t.bkContact, bkVal("bkContact")],
    [t.bkDate,    bkVal("bkDate")],
    [t.bkTime,    bkVal("bkTime")],
    [t.bkGuests,  bkVal("bkGuests")],
    [t.bkGirls,   bkVal("bkGirls")],
    [t.bkType,    ty ? ty.options[ty.selectedIndex].textContent : ""],
    [t.bkBudget,  bkVal("bkBudget")],
    [t.bkRemark,  bkVal("bkRemark")]
  ];
  let body = t.bkGreet + "\n\n" +
    rows.filter(r => r[1]).map(r => bkLabel(r[0]) + s + r[1]).join("\n");

  if(bkEl("bkAttach") && bkEl("bkAttach").checked && lastEst){
    body += "\n\n── " + t.bkEstHead + " ──\n"
          + lastEst.venue + " / " + st.hours + t.unitH + " / "
          + (st.pay === "cash" ? t.payCash : t.payCard) + "\n"
          + lastEst.items.map(i => `${i[0]} (${i[1]})${s}${nt(i[2])}`).join("\n") + "\n"
          + t.totLabel + s + nt(lastEst.sum);
  }
  return body + "\n\n" + t.bkSign;
}

function bkSay(text, ok){
  const el = bkEl("bkMsg");
  if(!el) return;
  el.textContent = text;
  el.classList.toggle("is-ok", !!ok);
}

const bookForm = bkEl("bookForm");
if(bookForm){
  /* 送出：交給瀏覽器做必填驗證，通過後才組 mailto */
  bookForm.addEventListener("submit", e=>{
    e.preventDefault();
    const url = "mailto:" + MAIL_TO
      + "?subject=" + encodeURIComponent(bookingSubject())
      + "&body="    + encodeURIComponent(bookingBody());
    bkSay(url.length > 1900 ? L().bkTooLong : L().bkSent, true);
    location.href = url;
  });

  /* 備援：複製整封內容，讓使用者自己貼到任何信箱 */
  bkEl("bkCopy").addEventListener("click", async ()=>{
    const t = L();
    const text = t.bkMailTo + t.sep + MAIL_TO + "\n"
               + t.bkSubject + t.sep + bookingSubject() + "\n\n"
               + bookingBody();
    let ok = false;
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    }catch(err){ ok = false; }
    if(!ok){                                  /* file:// 或舊瀏覽器 */
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try{ ok = document.execCommand("copy"); }catch(err){ ok = false; }
      ta.remove();
    }
    bkSay(ok ? t.bkCopied : t.bkCopyFail, ok);
  });

  /* 不能挑到過去的日期，預設帶今天 */
  const dIn = bkEl("bkDate"), now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  dIn.min = now.toISOString().slice(0,10);
  if(!dIn.value) dIn.value = dIn.min;
}

/* ── 整頁渲染 ── */
function paint(){
  const t = L();
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  document.querySelectorAll("[data-t]").forEach(el=>{ if(t[el.dataset.t]) el.innerHTML = t[el.dataset.t]; });

  document.getElementById("svcGrid").innerHTML = SVC.map((s,i)=>{
    const [a,b] = s[lang];
    return `<div><i>${String(i+1).padStart(2,"0")}</i><b>${a}</b><span>${b}</span></div>`;
  }).join("");

  document.getElementById("occBody").innerHTML = OCC.map(o=>{
    const [a,b,c,d] = o[lang];
    return `<tr><td class="c1">${a}</td><td class="c2">${b}</td><td class="c3">${c}</td><td class="c4">${d}</td></tr>`;
  }).join("");

  document.getElementById("flowList").innerHTML = FLOW.map((f,i)=>{
    const [a,b] = f[lang];
    return `<div><i>${String(i+1).padStart(2,"0")}</i><div><b>${a}</b><p>${b}</p></div></div>`;
  }).join("");

  const acc = arr => arr.map(x=>{
    const [q,a] = x[lang];
    return `<details><summary>${q}</summary><div class="bd">${a}</div></details>`;
  }).join("");
  document.getElementById("gloList").innerHTML = acc(GLO);
  document.getElementById("faqList").innerHTML = acc(FAQ);

  document.querySelectorAll("#tabs button").forEach(b=>{ b.textContent = RATE[b.dataset.k][lang]; });
  document.querySelectorAll("#vTabs button").forEach(b=>{ b.textContent = t.venTabs[+b.dataset.v]; });

  /* 預約單：placeholder、店型選項、收件信箱 */
  document.querySelectorAll("[data-ph]").forEach(el=>{ if(t[el.dataset.ph]) el.placeholder = t[el.dataset.ph]; });
  document.querySelectorAll("#bkType option[data-k]").forEach(o=>{ o.textContent = RATE[o.dataset.k][lang]; });
  document.getElementById("bkAddr").textContent = MAIL_TO;

  document.getElementById("footLine").textContent = "LINE：" + LINE_ID;
  const d = new Date();
  const serial = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  document.getElementById("slipNo").textContent = `NO. ${serial}`;
  document.getElementById("bkNo").textContent   = `FORM ${serial}`;

  calc(); renderLinesToggle(); lockTypedHeight(); lockMastHeight(); typeHero();
}

/* ── 事件 ── */
document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang = b.dataset.l;
    document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    const u = new URL(location); lang==="en" ? u.searchParams.set("lang","en") : u.searchParams.delete("lang");
    history.replaceState(null,"",u);
    paint();
  });
});
document.querySelectorAll(".step button").forEach(b=>{
  b.addEventListener("click",()=>{
    const k = b.dataset.f, [lo,hi] = LIM[k];
    st[k] = Math.min(hi, Math.max(lo, st[k] + +b.dataset.d)); calc();
  });
});
document.querySelectorAll("#tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true"); st.type = b.dataset.k; calc();
  });
});
document.querySelectorAll("#pay button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#pay button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true"); st.pay = b.dataset.p; calc();
  });
});
function venues(i){ document.getElementById("venList").innerHTML = VENUES[i].map(v=>`<li>${v}</li>`).join(""); }
document.querySelectorAll("#vTabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#vTabs button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true"); venues(+b.dataset.v);
  });
});

["ctaLine","ctaLine2"].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.href = "https://line.me/ti/p/~" + LINE_ID;
});

document.querySelector('.lang button[data-l="'+lang+'"]').setAttribute("aria-pressed","true");
document.querySelector('.lang button[data-l="'+(lang==="zh"?"en":"zh")+'"]').setAttribute("aria-pressed","false");
paint(); venues(0);

/* 字型載入完成／視窗寬度改變後重新量一次預留高度 */
function remeasure(){ lockTypedHeight(); lockMastHeight(); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);
let rszTimer;
addEventListener("resize",()=>{ clearTimeout(rszTimer); rszTimer = setTimeout(remeasure,150); });
</script>
